name: Deploy

on:
  # Deploy on merge (setkernel-live#30, hq#152): every push to main deploys, then a smoke check
  # waits for the Durable Object to run the new commit and checks each route; a failed check rolls
  # back to the previous version and opens an issue for the agents. Docs-only pushes don't deploy.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: setkernel-linux
    timeout-minutes: 25 # the smoke check may wait up to 10 minutes for the Durable Object
    permissions:
      contents: read
      id-token: write # OIDC login to Infisical
      issues: write   # open an issue when the smoke check fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Re-gate before deploy
        run: npm run validate

      # The deploy token lives in Infisical (project setkernel-live, prod), not in GitHub
      # (setkernel decision 0003 + amendments). Fetched last, so no npm script runs with it. The
      # org-runner Access token gets past Cloudflare Access; the identity only accepts this
      # workflow on main of this repo.
      - name: Fetch the deploy token from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 37b06681-c931-4bad-b3cf-4e76bfb633dc # setkernel-live-deploy
          oidc-audience: https://github.com/setkernel
          domain: https://secrets-api.setkernel.net
          project-slug: setkernel-live
          env-slug: prod
          secret-path: /
          export-type: env
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Account is resolved from the token; wrangler.jsonc carries no account id.
      # GITHUB_WEBHOOK_SECRET (same Infisical project) becomes a Worker secret for /github/webhook,
      # and BUZZ_PRIVATE_KEY (the Worker's Buzz identity for the "updates stopped" alert,
      # setkernel-live#9) another; the deploy fails if either is missing from Infisical.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          GITHUB_WEBHOOK_SECRET: ${{ env.GITHUB_WEBHOOK_SECRET }}
          BUZZ_PRIVATE_KEY: ${{ env.BUZZ_PRIVATE_KEY }}
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          secrets: |
            GITHUB_WEBHOOK_SECRET
            BUZZ_PRIVATE_KEY
          # VERSION = this commit, so /api/state shows which code the Durable Object runs.
          command: deploy --var VERSION:${{ github.sha }}

      # Runs without the deploy credentials: they are removed from its environment.
      - name: Smoke check
        id: smoke
        run: |
          set -o pipefail
          env -u CLOUDFLARE_API_TOKEN -u GITHUB_WEBHOOK_SECRET -u BUZZ_PRIVATE_KEY \
            node scripts/smoke.mjs --expect "${{ github.sha }}" 2>&1 | tee smoke.log

      - name: Roll back to the previous version
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler rollback --message "smoke check failed for ${{ github.sha }}"

      # smoke.log holds status codes, key names and the version only (scripts/smoke.mjs), never a body.
      - name: Open an issue for the agents
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The deploy of ${{ github.sha }} failed its smoke check and was rolled back to the previous version."
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo; echo '```'; tail -n 60 smoke.log; echo '```'
            echo; echo "README \"Reading a failed smoke\" says what each line means."
          } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Deploy smoke check failed for ${GITHUB_SHA::7}" --label agent-ready --body-file body.md
