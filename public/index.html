  <link rel="preload" href="/fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/manrope-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">

</head>
<body>
  <main class="day" id="day">
    <header class="mast">
      <p class="brand"><a href="https://setkernel.com">setkernel</a> <span>live</span></p>
      <p class="fresh"><span id="fresh"></span><span id="demo-note" hidden>Demo: sample data<span class="wide-only">, not the real office</span> · <a href="/">live page</a></span></p>
    </header>
    <section class="lead">
      <h1 id="headline">Connecting to the office…</h1>
      <p id="latest"></p>
    </section>
    <section aria-labelledby="chart-title">
      <div class="chart-head">
        <h2 id="chart-title">The last 24 hours</h2>
        <p id="chart-sub"></p>
        <p class="keys" id="keys"><kbd>←</kbd> <kbd>→</kbd> scrub · <kbd>Shift</kbd> an hour · <kbd>[</kbd> <kbd>]</kbd> previous or next action · <kbd>Esc</kbd> now</p>
      </div>
      <ul class="now" id="now" aria-label="Now" hidden></ul>
      <div class="plot" id="plot"></div>
      <p class="sr" id="readout" aria-live="polite"></p>
      <div class="foot">
        <ul class="legend" id="legend" aria-label="Key"></ul>
      </div>
    </section>
    <details class="table" id="table-box">
      <summary>The day as a table</summary>
      <div class="table-scroll" id="table"></div>
    </details>
    <p class="sr" id="announce" aria-live="polite"></p>
  </main>

  <!-- Three marks carry the story: merged, changes asked for, CI failed. A pull request opened is
       where the heavy In review line begins, so it has no mark. The rest is the stage line, the
       activity band, a quiet tick (Polaris's merges, CI passes), or words. A mark never relies on
       colour alone: each has its own shape. The states before a Now line are shapes too, not
       characters the fonts' Latin subsets don't have. -->
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="m-merged" viewBox="-6 -6 12 12"><circle r="4.6" fill="currentColor"/></symbol>
      <symbol id="m-requested_changes" viewBox="-6 -6 12 12"><path d="M-3.6-3.6L3.6 3.6M3.6-3.6L-3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="m-ci-fail" viewBox="-6 -6 12 12"><path d="M0-5.5V5.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
      <symbol id="m-tick" viewBox="-6 -6 12 12"><path d="M0-4V4" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="s-WORKING" viewBox="-6 -6 12 12"><circle r="4.4" fill="currentColor"/></symbol>
      <symbol id="s-REVIEW" viewBox="-6 -6 12 12"><circle r="4.4" fill="none" stroke="currentColor" stroke-width="1.3"/><circle r="2" fill="currentColor"/></symbol>
      <symbol id="s-DISCUSS" viewBox="-6 -6 12 12"><circle cx="-3.6" r="1.3" fill="currentColor"/><circle r="1.3" fill="currentColor"/><circle cx="3.6" r="1.3" fill="currentColor"/></symbol>
      <symbol id="s-PAUSED" viewBox="-6 -6 12 12"><path d="M-1.8-4V4M1.8-4V4" stroke="currentColor" stroke-width="1.6"/></symbol>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-ground" width="6" height="6"/><path class="hatch-line" d="M0 0V6" stroke-width="1"/></pattern>
      <!-- an engineer whose VM stopped reporting (setkernel-live#54): a dotted ring, the lane hatched in
           the signal colour, and the key's swatch for that hatch -->
      <symbol id="s-SILENT" viewBox="-6 -6 12 12"><circle r="4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.65 1.65"/></symbol>
      <pattern id="hatch-sig" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-ground" width="6" height="6"/><path class="hatch-sig-line" d="M0 0V6" stroke-width="1.2"/></pattern>
      <symbol id="m-silent" viewBox="-6 -6 12 12"><rect x="-5.5" y="-4.5" width="11" height="9" class="f-hatch-sig s-hatch-edge"/></symbol>
    </defs>
  </svg>
  <script type="module" src="/app.js"></script>
</body>
</html>
