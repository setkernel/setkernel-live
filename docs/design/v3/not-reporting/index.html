/* One type scale, one spacing scale. Every font size and every gap below is a step of these two,
   the SVG text classes too. The wall is not a second scale: it is the page drawn once on a fixed
   1440 x 810 canvas and scaled whole to the screen (fitWall in public/lib/layout.js).
   Every text colour here is checked for contrast in test/page.test.mjs, on the page and on the wall. */
:root {
  --bg: #f6f5f1; --surface: #ecebe4; --ink: #18181a; --ink-2: #4a4945; --ink-3: #66645e;
  --rule: #e6e3db; --rule-2: #cdc9be; --band: #e1ded4; --bar: #918d82;
  --signal: #b42318; --focus: #1d4ed8;
  --sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --f1: 12px; --f2: 14px; --f3: 16px; --f4: 20px; --f5: 24px; --f6: 32px;
  --l1: 16px; --l2: 20px; --l3: 24px; --l5: 32px; --l6: 40px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px;
  color-scheme: light;
}
/* The wall has one theme, fixed (hq#177, question 7): dark, for a screen that is on all day. */
html.wall {
  --bg: #111214; --surface: #1b1c20; --ink: #eeede9; --ink-2: #bdbbb5; --ink-3: #9a9892;
  --rule: #232427; --rule-2: #3d3e42; --band: #25262a; --bar: #77756f;
  --signal: #f2735f; --focus: #8fb0ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 var(--f3)/var(--l3) var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
b { font-weight: 600; }
a { color: inherit; text-underline-offset: 3px; }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.day { max-width: 1440px; margin: 0 auto; padding: 0 var(--s6) var(--s6); }
.mast { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
.brand { margin: 0; font-size: var(--f3); line-height: var(--l3); font-weight: 600; white-space: nowrap; }
.brand a { text-decoration: none; }
.brand a:hover { text-decoration: underline; }
.brand span { font-weight: 400; color: var(--ink-2); }
.fresh { margin: 0; font-size: var(--f2); line-height: var(--l2); color: var(--ink-2); text-align: right; }
.lead { padding: var(--s4) 0; max-width: 1080px; }
.lead h1 { margin: 0; font-size: var(--f6); line-height: var(--l6); font-weight: 400; letter-spacing: -0.01em; }
.lead p { margin: var(--s2) 0 0; font-size: var(--f3); line-height: var(--l3); color: var(--ink-2); min-height: var(--l3); }
.mood-offline .lead h1, .mood-waiting .lead h1 { color: var(--ink-2); }
.chart-head { display: flex; align-items: baseline; gap: var(--s3); padding-bottom: var(--s2); }
.chart-head h2 { margin: 0; font-size: var(--f3); line-height: var(--l3); font-weight: 600; white-space: nowrap; }
.chart-head p { margin: 0; font-size: var(--f2); line-height: var(--l2); color: var(--ink-3); }
.plot svg { display: block; overflow: visible; }
.plot svg:focus { outline: none; }
.plot svg:focus-visible .plotframe { stroke: var(--focus); stroke-width: 1; }
.foot { padding-top: var(--s3); margin-top: var(--s2); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin: 0; padding: 0; list-style: none; font-size: var(--f1); line-height: var(--l1); color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: var(--s2); white-space: nowrap; }
.legend svg { width: var(--s3); height: var(--s3); color: var(--ink); flex: none; }
.legend .sw { width: var(--s4); height: var(--s3); }
.legend .sw-2 { width: 52px; }
.legend .sw-3 { width: 80px; }
.keys { margin: 0 0 0 auto; font-size: var(--f1); line-height: var(--l1); color: var(--ink-3); white-space: nowrap; }
.keys kbd { font: var(--f1) var(--mono); border: 1px solid var(--rule-2); border-radius: 3px; padding: 0 var(--s1); color: var(--ink-2); }
.mood-waiting .foot, .mood-waiting .keys { display: none; }
.table { margin-top: var(--s5); font-size: var(--f2); line-height: var(--l2); }
.table summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.table-scroll { overflow-x: auto; }
.table table { border-collapse: collapse; margin-top: var(--s3); min-width: 560px; }
.table caption { text-align: left; color: var(--ink-3); padding-bottom: var(--s2); }
.table th, .table td { text-align: left; padding: var(--s1) var(--s3) var(--s1) 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.table th { font-weight: 600; color: var(--ink-2); }
.table td:first-child { font: var(--f1) var(--mono); color: var(--ink-2); white-space: nowrap; }
.table svg { width: var(--s3); height: var(--s3); vertical-align: -3px; margin-right: var(--s2); color: var(--ink); }

/* svg text: six sizes, two weights (400, 600), mono for clock times only */
.t-name { font: 600 var(--f3) var(--sans); fill: var(--ink); }
.t-sub { font: 600 var(--f2) var(--sans); fill: var(--ink-2); }
.t-ink { fill: var(--ink); }
.t-meta { font: 400 var(--f2) var(--sans); fill: var(--ink-2); }
.t-label { font: 400 var(--f1) var(--sans); fill: var(--ink-3); }
.t-axis { font: 400 var(--f1) var(--mono); fill: var(--ink-3); }
.t-axis-strong { font: 400 var(--f1) var(--mono); fill: var(--ink); }
.t-cur { font: 400 var(--f1) var(--mono); fill: var(--bg); }
.t-now-h { font: 600 var(--f2) var(--sans); fill: var(--ink); }
.t-now-who { font: 600 var(--f1) var(--sans); fill: var(--ink-3); }
.t-now-do { font: 600 var(--f4) var(--sans); fill: var(--ink); }
.t-now-do.small { font-size: var(--f3); }
.mood-offline .t-now-do, .mood-offline .t-now-pole { fill: var(--ink-2); }
