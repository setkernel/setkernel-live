name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: setkernel-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Syntax of every script, the unit tests, and a Wrangler dry-run build (no credentials).
      # The read-only job token only lifts the API rate limit for test/private-repos.test.mjs,
      # which lists setkernel's public repos live; it sees nothing private.
      - run: npm run validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
