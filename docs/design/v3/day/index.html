/* end fonts */

:root {
  --bg: #f6f5f1; --ink: #18181a; --ink-2: #4a4945; --ink-3: #66645e;
  --rule: #dcd9d1; --rule-2: #c2beb4; --bar: #8b877d; --hatch: #e6e3db;
  --signal: #b42318; --focus: #1d4ed8; --focus-bg: #e7edfb;
  --sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
/* The wall has one theme, fixed (hq#177, question 7): dark, for a screen that is on all day. */
html.wall {
  --bg: #111214; --ink: #eeede9; --ink-2: #bdbbb5; --ink-3: #9a9892;
  --rule: #2a2b2e; --rule-2: #3d3e42; --bar: #77756f; --hatch: #1d1e21;
  --signal: #f2735f; --focus: #8fb0ff; --focus-bg: #1c2540;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }

/* ---- the prototype's switcher: not part of the design ---- */
.proto { font: 12px/1.4 var(--mono); background: #2b2b2e; color: #e8e6e1; padding: 8px 48px; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: center; }
.proto b { font-weight: 500; color: #a9a7a1; margin-right: 6px; }
.proto button { font: inherit; color: inherit; background: none; border: 1px solid #55545a; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
.proto button[aria-pressed="true"] { background: #e8e6e1; color: #1b1b1d; border-color: #e8e6e1; }
.proto .note { color: #a9a7a1; margin-left: auto; }
.shot .proto { display: none; }

/* ---- the design ---- */
.day { max-width: 1440px; margin: 0 auto; padding: 0 48px 48px; }
.mast { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0 16px; border-bottom: 1px solid var(--rule); }
.brand { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-weight: 400; color: var(--ink-2); }
.fresh { margin: 0; font-size: 13px; color: var(--ink-2); }
.lead { padding: 28px 0 24px; max-width: 1080px; }
.lead h1 { margin: 0; font-size: 34px; line-height: 42px; font-weight: 400; letter-spacing: -0.015em; }
.lead h1 b, .lead p b { font-weight: 700; }
.lead p { margin: 12px 0 0; font-size: 16px; color: var(--ink-2); }
.mood-offline .lead h1, .mood-waiting .lead h1 { color: var(--ink-2); }
.chart-head { display: flex; align-items: baseline; gap: 16px; padding-bottom: 8px; }
.chart-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
.chart-head p { margin: 0; font-size: 13px; color: var(--ink-3); }
#plot svg { display: block; overflow: visible; }
#plot svg:focus { outline: none; }
#plot svg:focus-visible .plotframe { stroke: var(--focus); stroke-width: 1; }
.foot { padding-top: 16px; margin-top: 4px; border-top: 1px solid var(--rule); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend svg { width: 14px; height: 14px; color: var(--ink); flex: none; }
.legend .sw { width: 22px; height: 10px; }
.keys { margin: 0 0 0 auto; font-size: 12px; color: var(--ink-3); }
.mood-waiting .foot, .mood-waiting .keys { display: none; }
.keys kbd { font: 11px var(--mono); border: 1px solid var(--rule-2); border-radius: 3px; padding: 0 4px; color: var(--ink-2); }
.table { margin-top: 28px; font-size: 13px; }
.table summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.table table { border-collapse: collapse; margin-top: 12px; min-width: 560px; }
.table caption { text-align: left; color: var(--ink-3); padding-bottom: 8px; }
.table th, .table td { text-align: left; padding: 4px 16px 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.table th { font-weight: 600; color: var(--ink-2); }
.table td:first-child { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.table svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* svg text */
.t-name { font: 700 16px var(--sans); fill: var(--ink); }
.t-sub { font: 600 13px var(--sans); fill: var(--ink-2); }
.t-meta { font: 400 13px var(--sans); fill: var(--ink-2); }
.t-faint { font: 400 12px var(--sans); fill: var(--ink-3); }
.t-axis { font: 400 11px var(--mono); fill: var(--ink-3); }
.t-axis-strong { font: 500 11px var(--mono); fill: var(--ink); }
.t-m1 { font: 600 14px var(--sans); fill: var(--ink); }
.t-m2 { font: 400 13px var(--sans); fill: var(--ink-2); }
.t-mt { font: 500 11px var(--mono); fill: var(--ink-3); }
.t-cur { font: 500 11px var(--mono); fill: var(--bg); }
.m-sig { color: var(--signal); }
.mark { color: var(--ink); }

/* the wall: the same view, set for reading across a room (about 6 m; type from 22 px, names 44 px) */
html.wall .day { max-width: none; padding: 0 96px; }
html.wall .mast { padding: 40px 0 28px; }
html.wall .brand { font-size: 30px; }
html.wall .fresh { font-size: 28px; }
html.wall .lead { padding: 36px 0 32px; max-width: 2000px; }
html.wall .lead h1 { font-size: 62px; line-height: 74px; }
html.wall .lead p { font-size: 30px; margin-top: 16px; }
html.wall .chart-head h2 { font-size: 26px; }
html.wall .chart-head p { font-size: 24px; }
html.wall .legend { font-size: 22px; gap: 8px 32px; }
html.wall .foot { padding-top: 12px; }
html.wall .legend svg { width: 24px; height: 24px; }
html.wall .legend .sw { width: 36px; height: 16px; }
html.wall .keys, html.wall .table { display: none; }
html.wall .t-name { font-size: 44px; }
html.wall .t-sub { font-size: 28px; }
html.wall .t-meta { font-size: 26px; }
html.wall .t-faint { font-size: 22px; }
html.wall .t-axis, html.wall .t-axis-strong, html.wall .t-mt, html.wall .t-cur { font-size: 22px; }
html.wall .t-m1 { font-size: 32px; }
html.wall .t-m2 { font-size: 26px; }

/* narrow: the lanes run down the page */
html.narrow .proto { padding: 8px 16px; }
html.narrow .day { padding: 0 16px 32px; }
html.narrow .mast { padding: 14px 0 12px; }
html.narrow .lead { padding: 20px 0 16px; }
html.narrow .lead h1 { font-size: 24px; line-height: 31px; }
html.narrow .lead p { font-size: 14px; margin-top: 8px; }
html.narrow .fresh { font-size: 12px; }
html.narrow .chart-head { flex-direction: column; gap: 2px; }
html.narrow .keys { display: none; }
.now { margin: 0 0 24px; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.now li { display: grid; grid-template-columns: 72px 1fr; gap: 0 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.now .who { font-weight: 700; font-size: 14px; }
.now .who.sub { font-weight: 600; color: var(--ink-2); padding-left: 10px; font-size: 13px; }
.now .l1 { font-weight: 600; font-size: 14px; }
.now .l2 { color: var(--ink-2); grid-column: 2; }
.now .when { font: 500 11px var(--mono); color: var(--ink-3); border: 0; padding: 0 0 6px; display: block; }
</style>
</head>

<nav class="proto" aria-label="Prototype controls">

  <span><b>Day</b><button data-k="data" data-v="busy">busy</button> <button data-k="data" data-v="quiet">quiet day</button></span>

  <span class="note">Prototype controls, not part of the design · fixture clock: Wed 14 Oct 2026, 16:40 ADT</span>

<main class="day" id="day">
  <header class="mast">
    <p class="brand">setkernel <span>live</span></p>

  </header>

      <p class="keys" id="keys"><kbd>←</kbd> <kbd>→</kbd> scrub · <kbd>Shift</kbd> an hour · <kbd>[</kbd> <kbd>]</kbd> previous or next action · <kbd>Esc</kbd> now</p></div>

<!-- One shape per action, so a mark never relies on colour. Labels are in the key, on hover, in the
     scrub readout and in the table. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="m-picked_up" viewBox="-6 -6 12 12"><circle r="4.2" style="fill:var(--bg)" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="m-opened_pr" viewBox="-6 -6 12 12"><path d="M0-5.2L5.2 0L0 5.2L-5.2 0Z" fill="currentColor"/></symbol>
    <symbol id="m-pushed" viewBox="-6 -6 12 12"><path d="M0-4.6L4.6 3.6H-4.6Z" style="fill:var(--bg)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="m-approved" viewBox="-6 -6 12 12"><path d="M-4.2 0.2L-1.3 3.2L4.4-3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="m-requested_changes" viewBox="-6 -6 12 12"><path d="M-3.6-3.6L3.6 3.6M3.6-3.6L-3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>

    <symbol id="m-merged_by" viewBox="-6 -6 12 12"><circle r="2.4" fill="currentColor"/><circle r="4.8" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="m-posted_round" viewBox="-6 -6 12 12"><circle cx="-3.6" r="1.4" fill="currentColor"/><circle r="1.4" fill="currentColor"/><circle cx="3.6" r="1.4" fill="currentColor"/></symbol>
    <symbol id="m-decision_pr" viewBox="-6 -6 12 12"><rect x="-4" y="-4" width="8" height="8" fill="currentColor"/></symbol>
    <symbol id="m-opened_issue" viewBox="-6 -6 12 12"><rect x="-3.9" y="-3.9" width="7.8" height="7.8" style="fill:var(--bg)" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="m-commented" viewBox="-6 -6 12 12"><path d="M0-4.4L4.4 0L0 4.4L-4.4 0Z" style="fill:var(--bg)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="m-ci-pass" viewBox="-6 -6 12 12"><path d="M0-5V5" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="m-ci-fail" viewBox="-6 -6 12 12"><path d="M-3.6-3.6L3.6 3.6M3.6-3.6L-3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--bg)"/><path d="M0 0V6" style="stroke:var(--rule-2)" stroke-width="1"/></pattern>
  </defs>

<script>
/* lib */
const AGENTS = ["Vega","Rigel","Lyra","Orion","Polaris","Kochab","Pherkad","Yildun"];
// ---- public/lib/line.js, verbatim but for import and export
// "The line" (setkernel-live#36): the board under the sky that shows where each engineer's work
// is, Started -> Building -> In review -> Fixing -> Merged. No new data: each engineer's column comes
// from its own GitHub actions, its Claude requests and its current state, as the table in
// docs/design/v2/README.md says. Pure, so the Durable Object (through state.js), ?demo and the
// replay all run it, and it is tested.
//
// A lane is what the board remembers about one engineer's current (or last) job:
//   job    "started" (picked up an issue), "review" (opened a pull request, not merged yet),
//          "merged" (its pull request was merged), or absent (nothing seen yet)
//   at     when that job event happened (seconds)
//   built  a Claude request came after the pick-up, so the work is under way
//   repo   the job's repo, when it is public (events carry a name only for public repos)
//   asked  when a reviewer asked for changes on this pull request, if the page could tell
//   steps  when the job reached each column, for the star card's five steps
//   merge  a merge ({ at, repo }) that came in before its own pull request was opened (batches
//          can arrive out of order), kept until that pull request turns up

const STAGES = ["started", "building", "review", "fixing", "merged"];
const STAGE_NAME = { started: "Started", building: "Building", review: "In review", fixing: "Fixing", merged: "Merged" };
// A pick-up with no Claude request after it moves on to Building after this long anyway.
const STARTED_FOR_S = 120;

const REVIEWS = new Set(["approved", "requested_changes"]);

// Who a review is about: the one engineer, other than the reviewer, whose pull request is open
// in the same public repo. Private repos have no name on the page, so they never say. Like
// reviewTarget in words.js, it names an author only when it can be sure.
function laneAuthor(lines, reviewer, repo) {
  if (!repo) return null;
  const hits = Object.entries(lines ?? {}).filter(([name, l]) => name !== reviewer && l?.job === "review" && l.repo === repo);
  return hits.length === 1 ? hits[0][0] : null;
}

// Job events in the order a job goes through them; one no later than the lane's own is old news.
const JOB_RANK = { picked_up: 0, opened_pr: 1, merged: 2, started: 0, review: 1 };
const sameRepo = (a, b) => !a || !b || a === b;

// Apply clean events to the lanes of `engineers`. Any order: a batch is sorted by time, and an
// event older than what a lane already shows (a late batch, or a duplicate) leaves it alone, so
// the lanes come out as if every event had arrived in time order. Returns { lines, built } where
// built names the engineer of each job that moved from Started to Building (for today's count).
// One case it can't put right: the page has no pull request numbers, so a merge that arrives
// first is matched to the next opened_pr in its repo no later than it. If that pull request was
// an earlier one and the engineer has since picked up a new issue, a pick-up arriving after both
// is older than the merged lane and is skipped, so the card shows Merged until the next job event.
function stepLines(lines, events, engineers) {
  const out = structuredClone(lines ?? {});
  const built = [];
  const msgs = (events ?? []).filter((e) => e?.t === "msg" && Number.isFinite(e.ts)).sort((a, b) => a.ts - b.ts);
  for (const e of msgs) {
    if (e.kind === "github" && REVIEWS.has(e.action)) {
      // anyone's review, the director's included, can send an engineer's pull request back
      const author = laneAuthor(pick(out, engineers), e.agent, e.repo);
      const lane = out[author];
      // a review from before the pull request, or before the latest one, is old news
      if (!author || e.ts < lane.at || lane.asked > e.ts) continue;
      if (e.action === "requested_changes") {
        // a new round of changes: Fixing starts again from it (settleLines stamps it)
        if (!lane.asked && lane.steps) delete lane.steps.fixing;
        lane.asked = e.ts;
      } else delete lane.asked;
      continue;
    }
    if (!engineers.includes(e.agent)) continue;
    const lane = out[e.agent] ?? {};
    if (e.kind === "claude") {
      if (lane.job === "started" && !lane.built && e.ts >= lane.at) {
        lane.built = true;
        lane.steps = { ...lane.steps, building: e.ts };
        out[e.agent] = lane;
        built.push(e.agent);
      }
      continue;
    }
    if (e.kind !== "github") continue;
    if (lane.job && e.ts < lane.at) continue;
    if (lane.job && e.ts === lane.at && JOB_RANK[e.action] <= JOB_RANK[lane.job]) continue;
    const repo = e.repo ? { repo: e.repo } : {};
    // a push or merge is about the open pull request only: one for an earlier pull request, while
    // the engineer is on a new job, or in another repo, leaves the lane alone (it still counts)
    const ours = lane.job === "review" && sameRepo(e.repo, lane.repo);
    if (e.action === "picked_up") {
      // a merge that came in an earlier batch but is newer than this pick-up is still waiting for
      // this job's pull request
      const m = lane.merge;
      const keep = m && m.at > e.ts && sameRepo(m.repo, e.repo) ? { merge: m } : {};
      out[e.agent] = { job: "started", at: e.ts, built: false, ...repo, steps: { started: e.ts }, ...keep };
    }
    else if (e.action === "opened_pr") {
      if (lane.job === "started" && !lane.built) built.push(e.agent); // straight to a pull request: under way all the same
      const steps = lane.job === "started" ? { ...lane.steps, review: e.ts } : { review: e.ts };
      const m = lane.merge;
      if (m && e.ts <= m.at && sameRepo(m.repo, e.repo)) {
        // its merge came first, in an earlier batch: on to Merged
        out[e.agent] = { job: "merged", at: m.at, built: true, ...repo, steps: { ...steps, merged: m.at } };
      } else out[e.agent] = { job: "review", at: e.ts, built: true, ...repo, steps };
    } else if (e.action === "pushed" && ours && !(lane.asked > e.ts)) {
      const { asked, ...rest } = lane; // the fixes are in: back to waiting for review, from now
      out[e.agent] = { ...rest, steps: { ...lane.steps, review: asked || !lane.steps?.review ? e.ts : lane.steps.review } };
    } else if (e.action === "merged" && ours) {
      const { asked, ...rest } = lane;
      out[e.agent] = { ...rest, job: "merged", at: e.ts, ...repo, steps: { ...lane.steps, merged: e.ts } };
    } else if (e.action === "merged" && (!lane.job || lane.job === "started") && sameRepo(e.repo, lane.repo) && !(lane.merge?.at > e.ts)) {
      // no pull request open yet: this job's may still be on its way, so keep the merge for it
      out[e.agent] = { ...lane, merge: { at: e.ts, ...repo } };
    }
  }
  return { lines: out, built };
}

const pick = (lines, names) => Object.fromEntries(names.filter((n) => lines[n]).map((n) => [n, lines[n]]));

// Which column an engineer's card sits in, from its lane and its current state ({ state, work }).
// Addressing review feedback is Fixing whatever the lane says. A card never leaves the board:
// with no job seen yet it waits in Started.
function column(lane, info, nowS) {
  if (info?.state === "WORKING" && info.work === "changes") return "fixing";
  if (lane?.job === "review") return "review";
  if (lane?.job === "merged") return "merged";
  if (lane?.job === "started") return !lane.built && nowS - lane.at < STARTED_FOR_S ? "started" : "building";
  if (info?.state === "WORKING" && info.work === "issue") return "building";
  return "started";
}

// After a batch: note when a job reached a column the events alone don't mark (Building after
// the wait, Fixing from the state), so the star card has a time for every step it passed. Returns
// { lines, built } with built naming each job that went on to Building by the wait.
function settleLines(lines, agents, engineers, nowS) {
  const out = structuredClone(lines ?? {});
  const built = [];
  for (const name of engineers) {
    const lane = out[name];
    if (!lane?.job) continue;
    const col = column(lane, agents?.[name], nowS);
    if (col === "building" && !lane.built) {
      lane.built = true;
      built.push(name);
    }
    if (col === "building" && !lane.steps?.building) lane.steps = { ...lane.steps, building: Math.min(nowS, lane.at + STARTED_FOR_S) };
    if (col === "fixing" && !lane.steps?.fixing) lane.steps = { ...lane.steps, fixing: lane.asked ?? nowS };
  }
  return { lines: out, built };
}

// Who is reviewing whose pull request, for the reviewer chip: { author: reviewer }. Only an
// engineer in REVIEW whose state names a public repo where exactly one teammate's pull request is
// open; otherwise the reviewer is just "reviewing a pull request".
function reviewers(agents, lines, engineers) {
  const out = {};
  for (const name of engineers) {
    const info = agents?.[name];
    if (info?.state !== "REVIEW") continue;
    const author = laneAuthor(pick(lines ?? {}, engineers), name, info.repo);
    if (author && !out[author]) out[author] = name;
  }
  return out;
}

// The five steps of the job for the star card: [{ stage, status, ts }], where status is "done",
// "now", "todo" (not reached yet) or "skip" (passed without stopping, so no time).
function steps(lane, col) {
  const cur = STAGES.indexOf(col);
  const at = lane?.job ? lane.steps ?? {} : {};
  return STAGES.map((stage, i) => {
    const ts = Number.isFinite(at[stage]) ? at[stage] : null;
    let status;
    if (col === "merged" || i < cur) status = ts ? "done" : "skip";
    else if (i === cur) status = "now";
    else status = "todo";
    return { stage, status, ts: status === "todo" ? null : ts };
  });
}

// Replay's data covers the last 24 hours only, so a job begun before that (a pull request open
// for two days) would sit in Started. This keeps the live lanes whose job event is older than
// `sinceS`, as they were then: what happened since (a change request, a step, a merge waiting for
// its pull request) is left for the replay's own events to put back.
function seedLanes(lines, sinceS) {
  const out = {};
  for (const [name, lane] of Object.entries(lines ?? {})) {
    if (!lane?.job || !(lane.at < sinceS)) continue;
    const { asked, merge, steps: st, ...rest } = structuredClone(lane);
    const seed = { ...rest, steps: Object.fromEntries(Object.entries(st ?? {}).filter(([, ts]) => ts < sinceS)) };
    if (asked < sinceS) seed.asked = asked;
    if (lane.job === "started" && !(seed.steps.building < sinceS)) seed.built = false;
    out[name] = seed;
  }
  return out;
}

// Replay has no agent states, only events. This guesses them the way the board needs: an engineer
// whose Claude, chat or helper pulses came in the last few minutes is working, on review feedback
// when its pull request was sent back, otherwise on its issue. `last` is { name: ts of its latest
// pulse }.
const REPLAY_ACTIVE_S = 180;
function replayAgents(last, lines, engineers, nowS) {
  const out = {};
  for (const name of engineers) {
    const active = nowS - (last?.[name] ?? -Infinity) <= REPLAY_ACTIVE_S;
    const lane = lines?.[name];
    if (!active) out[name] = { state: "IDLE" };
    else out[name] = { state: "WORKING", work: lane?.job === "review" && lane.asked ? "changes" : "issue", ...(lane?.repo ? { repo: lane.repo } : {}) };
  }
  return out;
}

// ---- public/lib/words.js, verbatim but for import and export
// What the page says, in words: the headline, each star's label, the feed lines and the summary a
// screen reader hears through the aria-live region. No DOM here, so it runs under `node --test`.
// Every string is shown with textContent, never as markup.


const ACTION_TEXT = {
  picked_up: "started on an issue",
  opened_pr: "opened a pull request",
  approved: "approved a teammate's pull request",
  requested_changes: "asked for changes on a teammate's pull request",
  pushed: "pushed fixes to a pull request",
  posted_round: "posted in a design discussion",
  decision_pr: "wrote up a decision",
  merged: "had a pull request merged",
  merged_by: "merged a pull request",
  // requests (setkernel-live#35): what was asked is never on the page, only that it was
  opened_issue: "sent the team a request",
  commented: "commented",
};

// Who a star is, when its name alone doesn't say: shown under the name.
const STAR_NOTE = { Polaris: "the director" };

// Where a GitHub action happened, when the event names no repo: a private one. A design-discussion
// post isn't in a repo, and a request is sent to the team, so they say nothing.
const whereWork = (e) => (e?.action === "opened_issue" ? "" : e?.repo || (e?.action === "posted_round" ? "" : "a private project"));

const DOING = {
  issue: "working on an issue",
  changes: "addressing review feedback",
  decision: "writing up a decision",
  review: "reviewing a pull request",
  discussion: "in a design discussion",
};
const STATE_WORD = { WORKING: "Working", REVIEW: "Reviewing", DISCUSS: "Discussing", PAUSED: "Paused", IDLE: "Idle" };
const ACTIVE = new Set(["WORKING", "REVIEW", "DISCUSS"]);
const OFFLINE_AFTER_MS = 120_000;

const isActive = (info) => ACTIVE.has(info?.state);

// Times are shown in the visitor's own time zone. Every function that prints a time takes an
// optional IANA zone (tests pin "UTC" or "America/Halifax"); left out, the browser's zone is used.
const formats = new Map();
const format = (key, make) => formats.get(key) ?? formats.set(key, make()).get(key);
const toMs = (t) => (t > 1e11 ? t : t * 1000);

// Seconds or milliseconds since the epoch -> "14:02", 24-hour, in the visitor's zone.
function clock(t, timeZone) {
  const f = format(`clock ${timeZone}`, () => new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone }));
  return f.format(new Date(toMs(t)));
}

// The zone's short name at that moment -> "ADT" (or "AST" in winter, "UTC", "GMT+2").
function zoneName(t, timeZone, locale) {
  const f = format(`zone ${timeZone} ${locale}`, () => new Intl.DateTimeFormat(locale, { timeZoneName: "short", timeZone }));
  return f.formatToParts(new Date(toMs(t))).find((p) => p.type === "timeZoneName")?.value ?? "";
}

const localDay = (ms, timeZone) => format(`day ${timeZone}`, () => new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", timeZone })).format(new Date(ms));

// The counters reset at midnight UTC; say when that was on the visitor's clock -> "since 21:00 ADT
// yesterday" in Halifax just after midnight, "since 00:00 GMT" in London in winter.
function todaySince(now, timeZone, locale) {
  const ms = toMs(now), midnight = Math.floor(ms / 86_400_000) * 86_400_000;
  const when = `since ${clock(midnight, timeZone)} ${zoneName(midnight, timeZone, locale)}`.trimEnd();
  return localDay(midnight, timeZone) === localDay(ms, timeZone) ? when : `${when} yesterday`;
}

// How long ago the office last reported in -> "updated 12 s ago", "updated 3 min ago".
function freshness(lastIngest, now = Date.now()) {
  if (!lastIngest) return "";
  const s = Math.max(0, Math.floor((now - lastIngest) / 1000));
  if (s < 2) return "updated just now";
  if (s < 60) return `updated ${s} s ago`;
  if (s < 3600) return `updated ${Math.floor(s / 60)} min ago`;
  return `updated ${Math.floor(s / 3600)} h ago`;
}

// An agent's state -> "working on an issue in setkernel-live" (or "idle", "paused").
function doing(info) {
  if (!isActive(info)) return info?.state === "PAUSED" ? "paused" : "idle";
  const what = DOING[info.work] || (info.state === "REVIEW" ? DOING.review : info.state === "DISCUSS" ? DOING.discussion : "working");
  return info.repo ? `${what} in ${info.repo}` : what;
}

// Today's numbers for one agent -> "2 PRs · 4 reviews · 130 Claude", leaving out zeros.
function tally(c) {
  const parts = [[c?.prs, "PR", "PRs"], [c?.reviews, "review", "reviews"], [c?.claude, "Claude", "Claude"]].filter(([n]) => n > 0).map(([n, one, many]) => `${n} ${n === 1 ? one : many}`);
  return parts.length ? parts.join(" · ") : "nothing yet today";
}

// One GitHub event -> "Vega opened a pull request in lafka-plugin.", "Pherkad opened a pull
// request in a private project."
function sentence(e) {
  return `${e.agent} ${deed(e)}.`;
}

// The same without the name or the full stop -> "opened a pull request in lafka-plugin".
function deed(e) {
  const where = whereWork(e);
  return `${ACTION_TEXT[e.action] || "did something"}${where ? ` in ${where}` : ""}`;
}

// ---- CI runs (setkernel-live#14). A run has no agent; a public repo is named, a private one is not.
const ciWord = (r) => (r?.result === "pass" ? "passed" : "failed");
const ciWhere = (r) => r?.repo || "a private project";

// Today's CI counts -> "14 runs today · 92% passed". The rate rounds down, so a day with a failure
// never says 100%.
function ciSummary(c) {
  const runs = c?.ci > 0 ? c.ci : 0;
  if (!runs) return "No runs yet today";
  const pass = Math.min(runs, c.ciPass > 0 ? c.ciPass : 0);
  return `${runs} run${runs === 1 ? "" : "s"} today · ${Math.floor((100 * pass) / runs)}% passed`;
}

// ---- the headline (setkernel-live#36): one sentence naming every engineer, each name shown
// in its colour. A form is a list of parts: strings, and { name } where a name goes, so the page
// can underline each name without building markup. Three forms, longest first; the page shows
// the first that fits in three lines (fitHeadline).

// Each state as a glyph too, so the colour of a ring is never the only way to tell.
const GLYPH = { WORKING: "●", REVIEW: "◎", DISCUSS: "⋯", IDLE: "○", PAUSED: "‖" };
const STATE_WORDS = STATE_WORD;

// "Vega", "Vega and Rigel", "Vega, Rigel and Lyra", as parts.
function nameList(names) {
  const out = [];
  names.forEach((name, i) => {
    if (i) out.push(i === names.length - 1 ? " and " : ", ");
    out.push({ name });
  });
  return out;
}

// [one, many] for each kind of thing an engineer can be doing, in the long form.
const LONG = {
  changes: ["is addressing review feedback", "are addressing review feedback"],
  issue: ["is working on an issue", "are working on issues"],
  decision: ["is writing up a decision", "are writing up decisions"],
  review: ["is reviewing a pull request", "are reviewing pull requests"],
  discussion: ["is in a design discussion", "are in a design discussion"],
  working: ["is working", "are working"],
  idle: ["is idle", "are idle"],
  paused: ["is paused", "are paused"],
};
const SHORT_VERB = {
  WORKING: ["is working", "are working"],
  REVIEW: ["is reviewing", "are reviewing"],
  DISCUSS: ["is in a discussion", "are in a discussion"],
  IDLE: ["is idle", "are idle"],
  PAUSED: ["is paused", "are paused"],
};
const COUNT = ["No", "One", "Two", "Three", "All four"];

// What kind of thing an engineer is doing, as a key of LONG.
function kindOf(info) {
  if (!isActive(info)) return info?.state === "PAUSED" ? "paused" : "idle";
  if (info.work && LONG[info.work]) return info.work;
  return info.state === "REVIEW" ? "review" : info.state === "DISCUSS" ? "discussion" : "working";
}

// Join groups of parts into one sentence: "A, B and C."
function sentenceOf(groups) {
  const out = [];
  groups.forEach((g, i) => {
    if (i) out.push(i === groups.length - 1 ? " and " : ", ");
    out.push(...g);
  });
  out.push(".");
  return merge(out);
}

// Adjacent strings become one, so the page makes fewer nodes and tests read easily.
function merge(parts) {
  const out = [];
  for (const p of parts) {
    if (typeof p === "string" && typeof out.at(-1) === "string") out[out.length - 1] += p;
    else out.push(p);
  }
  return out;
}

// The three forms of the headline. names: the engineers, most recently active first; targets:
// { reviewer: author } where the page knows whose pull request is being reviewed.
function headlineForms(agents = {}, names = [], targets = {}) {
  const groups = new Map();
  const add = (key, name) => (groups.get(key) ?? groups.set(key, []).get(key)).push(name);
  const own = [];
  const rank = (k) => (k === "idle" ? 1 : k === "paused" ? 2 : 0); // the busy first, idle and paused last
  for (const name of names) {
    const info = agents[name];
    if (info?.state === "REVIEW" && targets[name]) own.push([{ name }, " is reviewing ", { name: targets[name] }, "'s pull request"]);
    else add(kindOf(info), name);
  }
  const keys = [...groups.keys()].sort((a, b) => rank(a) - rank(b));
  const long = [...own, ...keys.map((k) => { const g = groups.get(k); return [...nameList(g), ` ${LONG[k][g.length > 1 ? 1 : 0]}`]; })];
  const byState = new Map();
  for (const name of names) {
    const st = SHORT_VERB[agents[name]?.state] ? agents[name].state : "IDLE";
    (byState.get(st) ?? byState.set(st, []).get(st)).push(name);
  }
  const order = ["WORKING", "REVIEW", "DISCUSS", "IDLE", "PAUSED"].filter((k) => byState.has(k));
  const short = order.map((k) => { const g = byState.get(k); return [...nameList(g), ` ${SHORT_VERB[k][g.length > 1 ? 1 : 0]}`]; });
  const active = names.filter((n) => isActive(agents[n]));
  const count = active.length
    ? merge([`${COUNT[Math.min(active.length, 4)]} ${active.length === 1 ? "engineer is" : "engineers are"} at work: `, ...nameList(active), "."])
    : ["The engineers are between tasks."];
  return [sentenceOf(long), sentenceOf(short), count];
}

// The first form that fits, by the page's measure; the last if none does.
function fitHeadline(forms, fits) {
  return forms.find(fits) ?? forms.at(-1);
}

// The parts as plain text, for screen readers and tests.
const plain = (parts) => parts.map((p) => (typeof p === "string" ? p : p.name)).join("");

// The headline block: { forms, latest, mood }. mood is "live", "quiet", "offline" or "waiting";
// latest is the "Latest" line as parts ("Latest, 14:07 ADT: Orion approved …"). names: the
// engineers in order; targets as for headlineForms.
function headline({ agents = {}, seen = {}, feed = [], lastIngest = 0, now = Date.now(), timeZone, names = [], targets = {} } = {}) {
  const last = feed[0];
  const latest = last ? merge([`Latest, ${clock(last.ts, timeZone)} ${zoneName(last.ts, timeZone)}`.trimEnd() + ": ", { name: last.agent }, ` ${deed(last)}.`]) : [];
  if (!lastIngest) {
    return { forms: [["Waiting for the office to report in."]], latest: ["Nothing has arrived yet. Replay the last 24 hours, or watch the demo."], mood: "waiting" };
  }
  if (now - lastIngest > OFFLINE_AFTER_MS) {
    return { forms: [[`No word from the office since ${clock(lastIngest, timeZone)}.`]], latest: ["The engineers may still be working. This page catches up by itself."], mood: "offline" };
  }
  const order = [...names].sort((a, b) => (seen[b] ?? 0) - (seen[a] ?? 0));
  const mood = names.some((n) => isActive(agents[n])) ? "live" : "quiet";
  return { forms: headlineForms(agents, order, targets), latest, mood };
}

// The words beside a star, and on its card: { glyph, state: "Working", words: "working on an
// issue", repo } where repo is a public repo's name or "".
function stateWords(info) {
  const st = STATE_WORD[info?.state] ? info.state : "IDLE";
  const words = doing({ ...info, repo: undefined });
  return { glyph: GLYPH[st], state: STATE_WORD[st], words, repo: isActive(info) && info.repo ? info.repo : "" };
}

// Whose work a review was about, when the page can tell: an approval or change request in a
// public repo where another agent recently opened or pushed to a pull request. Private repos have
// no name on this page, so their reviews draw no line. recent: GitHub events, newest first.
function reviewTarget(e, recent, within = 86_400) {
  if (e?.action !== "approved" && e?.action !== "requested_changes") return null;
  if (!e.repo) return null;
  const hit = recent.find((w) => w.repo === e.repo && w.agent !== e.agent && (w.action === "opened_pr" || w.action === "pushed")
    && (e.ts ?? Infinity) - w.ts <= within && w.ts <= (e.ts ?? Infinity));
  return hit ? hit.agent : null;
}

// ---- spoken summary (from setkernel-live PR #8): at most one aria-live update every 30 s

const ANNOUNCE_EVERY_MS = 30_000;
const MAX_SENTENCES = 3;

// New GitHub events and requests, oldest first -> one short summary, or "" when there is nothing
// to say. Claude requests and chat posts are too frequent to read out; the counters cover them.
const spoken = (e) => e?.t === "msg" && (e.kind === "github" || e.kind === "request");
function summarise(events) {
  const work = events.filter(spoken);
  if (!work.length) return "";
  const said = work.slice(-MAX_SENTENCES).map(sentence);
  const more = work.length - said.length;
  if (more) said.unshift(`${more} more update${more === 1 ? "" : "s"}.`);
  return said.join(" ");
}

// Collects events and calls say(summary) at most once every `every` ms. The first batch is
// spoken straight away; anything inside the next window waits and is spoken together.
function createAnnouncer({ say, now = Date.now, setTimer = setTimeout, every = ANNOUNCE_EVERY_MS }) {
  let pending = [], last = -Infinity, timer = null;
  const flush = () => {
    timer = null;
    const text = summarise(pending);
    pending = [];
    if (!text) return;
    last = now();
    say(text);
  };
  return {
    add(events) {
      pending.push(...events.filter(spoken));
      if (!pending.length || timer) return;
      const wait = last + every - now();
      if (wait <= 0) flush();
      else timer = setTimer(flush, wait);
    },
  };
}

const $ = (id) => document.getElementById(id);

const opts = { mood: "live", data: "busy", layout: "page", shot: false };
for (const kv of location.hash.slice(1).split("&")) {
  const [k, v] = kv.split("=");
  if (k === "shot") opts.shot = true;
  else if (k in opts && v) opts[k] = v;
}

// ---- data: the fixture for the chosen mood and day
function scenario() {
  if (opts.mood === "waiting") return { agents: {}, counts: {}, byAgent: {}, seen: {}, line: {}, feed: [], ci: [], lastIngest: 0, replay: { pulses: [], work: [] } };
  const day = FIXTURES[opts.data];
  return day[opts.mood] ?? day.live;
}

// Halifax midnight before `s`: where "today" begins (hq#177, question 5).
function halifaxMidnight(s) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: HALIFAX, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date(s * 1000)).map((x) => [x.type, +x.value]));
  return s - (p.hour * 3600 + p.minute * 60 + p.second);
}

function prep(s) {
  const lastS = s.lastIngest ? Math.floor(s.lastIngest / 1000) : null;
  const bins = Object.fromEntries(ENG.map((n) => [n, { claude: new Array(BINS).fill(0), chat: new Array(BINS).fill(0), helper: new Array(BINS).fill(0) }]));
  const binOf = (ts) => Math.floor((ts - T0) / BIN);
  for (const r of s.replay.pulses) {
    const i = binOf(r[0] * 60);
    if (i < 0 || i >= BINS) continue;
    ENG.forEach((n, k) => ["claude", "chat", "helper"].forEach((kind, j) => { bins[n][kind][i] += r[1 + k * 4 + j] || 0; }));
  }
  const work = s.replay.work.filter((w) => w.ts >= T0 && w.ts <= NOW);
  const ci = (s.ci ?? []).filter((c) => c.ts >= T0).slice().reverse();
  // Stages along each lane: the replay's actions and Claude requests, in time order, through
  // line.js's own stepLines, starting from the live lanes older than the window (seedLanes).
  let lines = seedLanes(s.line, T0);
  const events = [
    ...work.map((w) => ({ t: "msg", kind: REQUEST_ACTIONS_LOCAL.includes(w.action) ? "request" : "github", ...w })),
    ...s.replay.pulses.flatMap((r) => ENG.filter((n, k) => r[1 + k * 4] > 0).map((agent) => ({ t: "msg", kind: "claude", agent, ts: r[0] * 60 }))),
  ].filter((e) => e.ts >= T0).sort((a, b) => a.ts - b.ts);
  const spans = Object.fromEntries(ENG.map((n) => [n, []]));
  const open = {};
  const stageOf = (lane) => !lane?.job ? null : lane.job === "started" ? (lane.built ? "building" : "started") : lane.job === "review" ? (lane.asked ? "fixing" : "review") : "merged";
  const close = (n, to) => {
    const o = open[n];
    if (!o) return;
    if (o.stage === "started" && to - o.from > STARTED_FOR_S) { // on to Building after the wait
      spans[n].push({ stage: "started", from: o.from, to: o.from + STARTED_FOR_S }, { stage: "building", from: o.from + STARTED_FOR_S, to });
    } else spans[n].push({ ...o, to });
    delete open[n];
  };
  for (const n of ENG) { const st = stageOf(lines[n]); if (st && st !== "merged") open[n] = { stage: st, from: T0, seeded: true }; }
  for (const e of events) {
    lines = stepLines(lines, [e], ENG).lines;
    for (const n of ENG) {
      const st = stageOf(lines[n]);
      if ((open[n]?.stage ?? null) === st || (st === "merged" && !open[n])) continue;
      close(n, e.ts);
      if (st && st !== "merged") open[n] = { stage: st, from: e.ts };
    }
  }
  const end = lastS ?? NOW;
  for (const n of ENG) close(n, end);
  const workCapped = s.replay.work.length >= 300; // REPLAY_WORK: older actions were dropped
  const ciCapped = (s.ci ?? []).length >= 20;     // CI_RECENT: older runs were dropped
  return { s, lastS, bins, work, ci, spans, workFrom: workCapped ? work[0]?.ts : null, ciFrom: ciCapped && ci.length ? ci[0].ts : null, mid: halifaxMidnight(NOW) };
}
const REQUEST_ACTIONS_LOCAL = ["opened_issue", "commented"];

const binTime = (i) => T0 + i * BIN;
const stageAt = (d, n, ts) => d.spans[n].find((sp) => ts >= sp.from && ts < sp.to)?.stage ?? null;
const inBin = (list, i) => list.filter((w) => w.ts >= binTime(i) && w.ts < binTime(i) + BIN);
const when = (ts) => `${clock(ts, TZ)}`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);
// Polaris's numbers today, in tally()'s form: requests, merges and reviews.
function poleTally(c) {
  const parts = [[c?.requests, "request", "requests"], [c?.merges, "merge", "merges"], [c?.reviews, "review", "reviews"]].filter(([n]) => n > 0).map(([n, a, b]) => plural(n, a, b));
  return parts.length ? parts.join(" · ") : "nothing yet today";
}
const label = (e) => `${e.agent} ${deed(e)}, ${when(e.ts)}`;
const ciLabel = (c) => `CI ${ciWord(c)} in ${ciWhere(c)}, ${when(c.ts)}`;

// What a row says in the "moment" column: now (or at the last word), or at a scrubbed bin.
function moment(d, row, i) {
  const s = d.s;
  if (!s.lastIngest) return [];
  if (row.kind === "ci") {
    const list = i == null ? d.ci.slice(-1) : inBin(d.ci, i);
    if (i == null) return list.length ? [`${capital(ciWord(list[0]))}, ${when(list[0].ts)}`, `in ${ciWhere(list[0])}`] : ["No runs yet"];
    return list.length ? list.map((c) => `${capital(ciWord(c))} in ${ciWhere(c)}`).slice(0, 2) : ["No runs"];
  }
  const mine = d.work.filter((w) => w.agent === row.id);
  if (row.kind !== "eng") {
    // the pole stars: their last action (where it was is in the table and on hover)
    if (i != null) { const here = inBin(mine, i); return here.length ? [`${capital(ACTION_TEXT[here[0].action])}${here.length > 1 ? `, and ${here.length - 1} more` : ""}`] : [""]; }
    const last = mine.at(-1);
    return last ? [`${when(last.ts)} ${ACTION_TEXT[last.action]}`] : [""];
  }
  if (i == null) {
    const info = s.agents?.[row.id];
    const lane = s.line?.[row.id];
    const col = lane?.job ? column(lane, info, d.lastS ?? NOW) : null;
    const since = col && (lane.steps?.[col] ?? lane.at);
    const stage = !col ? "" : col === "merged" ? `Merged at ${when(since)}` : `${STAGE_NAME[col]} since ${when(since)}`;
    return [`${stateWords(info).glyph} ${capital(doing(info))}`, stage];
  }
  const st = stageAt(d, row.id, binTime(i) + BIN - 1);
  const b = d.bins[row.id];
  const here = inBin(mine, i);
  const pulse = [b.claude[i] && plural(b.claude[i], "Claude request", "Claude requests"), b.chat[i] && plural(b.chat[i], "chat post", "chat posts")].filter(Boolean).join(", ");
  return [here.length ? `${capital(ACTION_TEXT[here.at(-1).action])}${here.length > 1 ? `, and ${here.length - 1} more` : ""}` : pulse ? capital(pulse) : "No activity", st ? STAGE_NAME[st] : ""];
}

// ---------------------------------------------------------------- drawing
const node = (tag, attrs, parent) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent?.appendChild(n); return n; };
const text = (parent, x, y, s, cls, anchor) => { const t = node("text", { x, y, class: cls, ...(anchor ? { "text-anchor": anchor } : {}) }, parent); t.textContent = s; return t; };
const fit = (t, w) => { if (!t.textContent || t.getComputedTextLength() <= w) return t; let s = t.textContent; while (s.length > 1 && t.getComputedTextLength() > w) { s = s.slice(0, -1); t.textContent = `${s.trimEnd()}…`; } return t; };
const mark = (parent, id, x, y, r, title, cls = "mark") => { const g = node("g", { class: cls }, parent); node("use", { href: `#m-${id}`, x: x - r, y: y - r, width: 2 * r, height: 2 * r }, g); node("title", {}, g).textContent = title; return g; };
const markId = (e) => e.action;
const markCls = (e) => (e.action === "requested_changes" ? "mark m-sig" : "mark");

const SIZES = {
  page: { gutL: 216, gutR: 320, gap: 24, axis: 30, pole: 50, sub: 24, eng: 70, ci: 34, sep: 14, r: 5.5, rs: 4.5, lh: 18, tick: 4 },
  wall: { gutL: 400, gutR: 760, gap: 56, axis: 50, pole: 86, sub: 38, eng: 122, ci: 64, sep: 26, r: 10, rs: 8, lh: 34, tick: 8 },
};

function rowsFor() {
  return [
    { id: "Polaris", kind: "pole" }, ...SUBS.map((id) => ({ id, kind: "sub" })), { kind: "sep" },
    ...ENG.map((id) => ({ id, kind: "eng" })), { kind: "sep" }, { id: "CI", kind: "ci" },
  ];
}

let D, scrub = null, plotApi = null;

function drawH(d) {
  const S = SIZES[opts.layout === "wall" ? "wall" : "page"];
  const box = $("plot");
  box.textContent = "";
  const W = box.clientWidth;
  const px0 = S.gutL + S.gap, px1 = W - S.gutR - S.gap, pw = px1 - px0;
  const x = (ts) => px0 + ((ts - T0) / SPAN) * pw;
  const rows = rowsFor();
  let y = S.axis;
  for (const r of rows) { r.y = y; r.h = S[r.kind]; y += r.h; }
  const H = y + 8;
  const svg = node("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: "slider", "aria-label": "The last 24 hours. Use the arrow keys to move through the day.", "aria-valuemin": 0, "aria-valuemax": BINS - 1 }, box);
  const bg = node("g", {}, svg), fg = node("g", {}, svg), cur = node("g", {}, svg);

  // hour rules and labels; Halifax midnight is "today"
  for (let h = Math.ceil(T0 / 3600) * 3600; h <= NOW; h += 3600) {
    const hx = x(h);
    const isMid = h === d.mid;
    const every = opts.layout === "wall" ? 3 : 3;
    const hourHere = Math.round(((h - d.mid) / 3600 + 48)) % 24;
    if (!isMid && hourHere % every) continue;
    node("line", { x1: hx, x2: hx, y1: S.axis - 6, y2: H - 8, stroke: isMid ? "var(--rule-2)" : "var(--rule)", "stroke-width": 1 }, bg);
    if (isMid) {
      text(bg, hx + 6, S.axis - 12, `Today · ${clock(h, TZ)} ${zoneName(h, TZ)}`, "t-axis-strong");
      text(bg, hx - 6, S.axis - 12, "Yesterday", "t-axis", "end");
    } else if ((hx > x(d.mid) ? hx - x(d.mid) > (opts.layout === "wall" ? 290 : 120) : x(d.mid) - hx > (opts.layout === "wall" ? 150 : 110)) && px1 - hx > (opts.layout === "wall" ? 110 : 60)) text(bg, hx, S.axis - 12, clock(h, TZ), "t-axis", "middle");
  }
  // the now edge
  node("line", { x1: px1, x2: px1, y1: S.axis - 6, y2: H - 8, stroke: "var(--ink)", "stroke-width": 1.5 }, bg);
  text(bg, px1, S.axis - 12, `${clock(NOW, TZ)}`, "t-axis-strong", "end");

  // row rules and the left gutter
  const maxClaude = Math.max(1, ...ENG.flatMap((n) => d.bins[n].claude));
  const maxChat = Math.max(1, ...ENG.flatMap((n) => d.bins[n].chat));
  d.scale = { maxClaude, maxChat };
  const bw = Math.max(1, pw / BINS - (opts.layout === "wall" ? 2 : 1.4));
  for (const r of rows) {
    if (r.kind === "sep") continue;
    const base = r.y + r.h;
    if (r.kind !== "sub" || r.id === "Yildun") node("line", { x1: 0, x2: W, y1: base, y2: base, stroke: "var(--rule)" }, bg);
    const g = node("g", {}, fg);
    if (r.kind === "eng") {
      fit(text(g, 0, r.y + S.lh + 4, r.id, "t-name"), S.gutL);
      fit(text(g, 0, r.y + S.lh * 2 + 8, d.s.lastIngest ? tally(d.s.byAgent?.[r.id]) : "", "t-meta"), S.gutL);
    } else if (r.kind === "pole") {
      const n = text(g, 0, r.y + S.lh + 2, "Polaris", "t-name");
      const nw = n.getComputedTextLength();
      text(g, nw + S.lh * 0.4, r.y + S.lh + 2, STAR_NOTE.Polaris, "t-meta");
      fit(text(g, 0, r.y + S.lh * 2 + 6, d.s.lastIngest ? poleTally(d.s.byAgent?.Polaris) : "", "t-meta"), S.gutL);
    } else if (r.kind === "sub") {
      const nm = text(g, S.lh * 0.6, r.y + r.h * 0.68, r.id, "t-sub");
      const c = d.s.byAgent?.[r.id];
      fit(text(g, S.gutL, r.y + r.h * 0.68, d.s.lastIngest && c ? tally(c) : "", "t-faint", "end"), S.gutL - S.lh * 1.4 - nm.getComputedTextLength());
    } else if (r.kind === "ci") {
      text(g, 0, r.y + r.h * 0.45, "CI", "t-name");
      fit(text(g, 0, r.y + r.h * 0.45 + S.lh, d.s.lastIngest ? ciSummary(d.s.counts) : "", "t-faint"), S.gutL);
    }
  }

  // limits the data can't cross: hatched, and said in words
  const hatch = (from, to, y0, y1, words) => {
    if (!(to > from)) return;
    node("rect", { x: x(from), y: y0, width: x(to) - x(from), height: y1 - y0, fill: "url(#hatch)" }, bg);
    if (words && x(to) - x(from) > 120) {
      const t = text(bg, x(from) + 8, (y0 + y1) / 2 + 4, words, "t-faint");
      const w = t.getComputedTextLength() + 12;
      node("rect", { x: x(from) + 2, y: (y0 + y1) / 2 - S.lh * 0.55, width: w, height: S.lh * 1.1, fill: "var(--bg)" }, bg).after(t);
    }
  };
  const ciRow = rows.find((r) => r.kind === "ci");
  if (d.lastS && d.lastS < NOW - 60) hatch(d.lastS, NOW, rows[0].y, ciRow.y + ciRow.h, `No word since ${clock(d.lastS * 1000, TZ)}`);
  if (!d.s.lastIngest) hatch(T0, NOW, rows[0].y, ciRow.y + ciRow.h, "Nothing has arrived yet");
  if (d.ciFrom) hatch(T0, d.ciFrom, ciRow.y + 4, ciRow.y + ciRow.h - 4, "Older runs aren't kept");
  if (d.workFrom) for (const r of rows.filter((r) => r.kind === "eng" || r.kind === "pole")) hatch(T0, d.workFrom, r.y + 4, r.y + r.h - 4, "Older actions aren't kept");

  // engineer lanes: Claude density above, the job's stages on the track, chat below
  for (const r of rows.filter((r) => r.kind === "eng")) {
    const b = d.bins[r.id];
    const top = r.y + 8, base = r.y + r.h * 0.46, track = r.y + r.h * 0.64, chatBase = r.y + r.h - 6, chatH = r.h * 0.09;
    for (let i = 0; i < BINS; i++) {
      const bx = x(binTime(i)) + 0.7;
      if (b.claude[i]) { const h = Math.max(1.5, ((base - top) * b.claude[i]) / maxClaude); node("rect", { x: bx, y: base - h, width: bw, height: h, fill: "var(--bar)" }, fg); }
      if (b.chat[i]) { const h = Math.max(2, (chatH * b.chat[i]) / maxChat); node("rect", { x: bx, y: chatBase - h, width: bw, height: h, fill: "var(--ink-3)" }, fg); }
    }
    for (const sp of d.spans[r.id]) {
      const a = x(sp.from), z = Math.max(x(sp.to), a + 1);
      const style = { started: { w: 1, c: "var(--ink-3)" }, building: { w: 2, c: "var(--ink-2)" }, review: { w: S.r * 0.8, c: "var(--ink)" }, fixing: { w: 2, c: "var(--signal)", dash: `${S.r * 0.7} ${S.r * 0.5}` } }[sp.stage];
      node("line", { x1: a, x2: z, y1: track, y2: track, stroke: style.c, "stroke-width": style.w, ...(style.dash ? { "stroke-dasharray": style.dash } : {}) }, fg);
    }
    for (const w of d.work.filter((w) => w.agent === r.id)) mark(fg, markId(w), x(w.ts), track, S.r, label(w), markCls(w));
  }
  // the pole stars: actions only (their chat and Claude never reach the replay)
  for (const r of rows.filter((r) => r.kind === "pole" || r.kind === "sub")) {
    const yy = r.kind === "pole" ? r.y + r.h * 0.5 : r.y + r.h * 0.55;
    node("line", { x1: px0, x2: px1, y1: yy, y2: yy, stroke: "var(--rule)", "stroke-width": 1 }, bg);
    for (const w of d.work.filter((w) => w.agent === r.id)) mark(fg, markId(w), x(w.ts), yy, r.kind === "pole" ? S.r : S.rs, label(w), markCls(w));
  }
  // CI: one shared band, no owner
  {
    const yy = ciRow.y + ciRow.h * 0.5;
    for (const c of d.ci) mark(fg, c.result === "pass" ? "ci-pass" : "ci-fail", x(c.ts), yy, c.result === "pass" ? S.r : S.r * 0.85, ciLabel(c), c.result === "pass" ? "mark" : "mark m-sig");
  }
  node("rect", { class: "plotframe", x: px0 - 4, y: S.axis - 6, width: pw + 8, height: H - S.axis - 2, fill: "none", stroke: "none" }, bg);

  // the moment column: now, or the scrubbed ten minutes
  const mom = node("g", {}, svg);
  const mx = px1 + S.gap;
  function drawMoment(i) {
    mom.textContent = "";
    const title = !d.s.lastIngest ? "" : i != null ? `${clock(binTime(i), TZ)}–${clock(binTime(i) + BIN, TZ)}` : d.lastS < NOW - 60 ? `Last word, ${clock(d.lastS * 1000, TZ)}` : "Now";
    text(mom, mx, S.axis - 12, title, i != null ? "t-axis-strong" : "t-mt");
    for (const r of rows) {
      if (r.kind === "sep") continue;
      const lines = moment(d, r, i);
      if (r.kind === "eng") {
        fit(text(mom, mx, r.y + S.lh + 4, lines[0] ?? "", "t-m1"), S.gutR);
        fit(text(mom, mx, r.y + r.h * 0.64 + S.lh * 0.28, lines[1] ?? "", "t-m2"), S.gutR);
      } else if (r.kind === "pole") fit(text(mom, mx, r.y + r.h * 0.5 + S.lh * 0.3, lines[0] ?? "", "t-m2"), S.gutR);
      else if (r.kind === "sub") fit(text(mom, mx, r.y + r.h * 0.68, lines[0] ?? "", "t-faint"), S.gutR);
      else if (r.kind === "ci") {
        fit(text(mom, mx, r.y + r.h * 0.45, lines[0] ?? "", "t-m2"), S.gutR);
        if (lines[1]) fit(text(mom, mx, r.y + r.h * 0.45 + S.lh, lines[1], "t-faint"), S.gutR);
      }
    }
  }
  // the scrub cursor
  function drawCursor(i) {
    cur.textContent = "";
    if (i == null) return;
    const cx = x(binTime(i) + BIN / 2);
    node("rect", { x: x(binTime(i)), y: S.axis - 6, width: Math.max(2, pw / BINS), height: H - S.axis - 2, fill: "var(--focus)", opacity: 0.14 }, cur);
    node("line", { x1: cx, x2: cx, y1: S.axis - 6, y2: H - 8, stroke: "var(--focus)", "stroke-width": 1.5 }, cur);
    const t = text(cur, cx, S.axis - 12, clock(binTime(i), TZ), "t-cur", "middle");
    const w = t.getComputedTextLength() + 12;
    node("rect", { x: cx - w / 2, y: S.axis - 12 - S.lh * 0.8, width: w, height: S.lh * 1.05, rx: 2, fill: "var(--focus)" }, cur).after(t);
  }
  drawMoment(null);
  return { svg, drawMoment, drawCursor, pick: (ev) => { const r = svg.getBoundingClientRect(); const px = ev.clientX - r.left; return px < px0 - 2 || px > px1 + 2 ? undefined : Math.min(BINS - 1, Math.max(0, Math.floor(((px - px0) / pw) * BINS))); } };
}

// narrow: time runs down the page, newest at the top; one column per lane
function drawV(d) {
  const box = $("plot");
  box.textContent = "";
  const W = box.clientWidth;
  const ax = 40, colW = { pole: 18, sub: 14, eng: Math.floor((W - ax - 18 - 42 - 24 - 12) / 4), ci: 24 };
  const cols = [];
  let cx = ax;
  for (const r of rowsFor()) {
    if (r.kind === "sep") { cx += 6; continue; }
    cols.push({ ...r, x: cx, w: colW[r.kind] });
    cx += colW[r.kind];
  }
  const top = 70, binH = 5, H = top + BINS * binH + 12;
  const y = (ts) => top + ((NOW - ts) / SPAN) * BINS * binH;
  const svg = node("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: "slider", "aria-label": "The last 24 hours, newest first. Use the arrow keys to move through the day.", "aria-valuemin": 0, "aria-valuemax": BINS - 1 }, box);
  const bg = node("g", {}, svg), fg = node("g", {}, svg), cur = node("g", {}, svg);
  // headers
  for (const c of cols) {
    if (c.kind === "eng") { text(bg, c.x + c.w / 2, top - 10, c.id, "t-sub", "middle").setAttribute("style", "fill:var(--ink)"); continue; }
    if (c.kind === "ci") continue;
    const t = text(bg, 0, 0, c.id, c.kind === "pole" ? "t-sub" : "t-faint");
    t.setAttribute("transform", `translate(${c.x + c.w / 2 + 4} ${top - 8}) rotate(-90)`);
    if (c.kind === "pole") t.setAttribute("style", "fill:var(--ink)");
  }
  node("line", { x1: 0, x2: W, y1: top - 4, y2: top - 4, stroke: "var(--rule)" }, bg);
  // hour rules
  for (let h = Math.ceil(T0 / 3600) * 3600; h <= NOW; h += 3600) {
    const isMid = h === d.mid, hourHere = Math.round(((h - d.mid) / 3600 + 48)) % 24;
    if (!isMid && hourHere % 3) continue;
    node("line", { x1: isMid ? 0 : ax - 4, x2: W, y1: y(h), y2: y(h), stroke: isMid ? "var(--rule-2)" : "var(--rule)" }, bg);
    if (isMid) { text(bg, 0, y(h) - 5, "Today", "t-axis-strong"); text(bg, 0, y(h) + 13, clock(h, TZ), "t-axis"); }
    else text(bg, 0, y(h) + 4, clock(h, TZ), "t-axis");
  }
  text(bg, 0, top + 4, clock(NOW, TZ), "t-axis-strong");
  node("line", { x1: ax - 4, x2: W, y1: top, y2: top, stroke: "var(--ink)", "stroke-width": 1.5 }, bg);
  const maxClaude = Math.max(1, ...ENG.flatMap((n) => d.bins[n].claude));
  const maxChat = Math.max(1, ...ENG.flatMap((n) => d.bins[n].chat));
  d.scale = { maxClaude, maxChat };
  const hatch = (from, to, x0, x1, words) => {
    if (!(to > from)) return;
    node("rect", { x: x0, y: y(to), width: x1 - x0, height: y(from) - y(to), fill: "url(#hatch)" }, bg);
    if (words && y(from) - y(to) > 30) { const t = text(bg, x0 + 6, y(to) + 16, words, "t-faint"); node("rect", { x: x0 + 2, y: y(to) + 4, width: t.getComputedTextLength() + 8, height: 16, fill: "var(--bg)" }, bg).after(t); }
  };
  const ciCol = cols.find((c) => c.kind === "ci");
  if (d.lastS && d.lastS < NOW - 60) hatch(d.lastS, NOW, ax, W, `No word since ${clock(d.lastS * 1000, TZ)}`);
  if (!d.s.lastIngest) hatch(T0, NOW, ax, W, "Nothing has arrived yet");
  if (d.ciFrom) hatch(T0, d.ciFrom, ciCol.x + 2, ciCol.x + ciCol.w - 2);
  for (const c of cols) {
    if (c.kind === "eng") {
      const b = d.bins[c.id];
      const left = c.x + 3, barW = c.w * 0.5, track = c.x + c.w * 0.68, chatX = c.x + c.w - 4;
      for (let i = 0; i < BINS; i++) {
        const by = y(binTime(i) + BIN) + 0.5;
        if (b.claude[i]) node("rect", { x: left, y: by, width: Math.max(1.5, (barW * b.claude[i]) / maxClaude), height: binH - 1, fill: "var(--bar)" }, fg);
        if (b.chat[i]) node("rect", { x: chatX - Math.max(2, (5 * b.chat[i]) / maxChat), y: by, width: Math.max(2, (5 * b.chat[i]) / maxChat), height: binH - 1, fill: "var(--ink-3)" }, fg);
      }
      for (const sp of d.spans[c.id]) {
        const style = { started: { w: 1, c: "var(--ink-3)" }, building: { w: 2, c: "var(--ink-2)" }, review: { w: 4, c: "var(--ink)" }, fixing: { w: 2, c: "var(--signal)", dash: "3 2" } }[sp.stage];
        node("line", { x1: track, x2: track, y1: y(sp.to), y2: Math.max(y(sp.from), y(sp.to) + 1), stroke: style.c, "stroke-width": style.w, ...(style.dash ? { "stroke-dasharray": style.dash } : {}) }, fg);
      }
      for (const w of d.work.filter((w) => w.agent === c.id)) mark(fg, markId(w), track, y(w.ts), 4.5, label(w), markCls(w));
      node("line", { x1: c.x + c.w, x2: c.x + c.w, y1: top, y2: H - 12, stroke: "var(--rule)" }, bg);
    } else if (c.kind === "ci") {
      for (const r of d.ci) mark(fg, r.result === "pass" ? "ci-pass" : "ci-fail", c.x + c.w / 2, y(r.ts), 4, ciLabel(r), r.result === "pass" ? "mark" : "mark m-sig");
      text(bg, c.x + c.w / 2, top - 10, "CI", "t-sub", "middle");
    } else {
      node("line", { x1: c.x + c.w / 2, x2: c.x + c.w / 2, y1: top, y2: H - 12, stroke: "var(--rule)" }, bg);
      for (const w of d.work.filter((w) => w.agent === c.id)) mark(fg, markId(w), c.x + c.w / 2, y(w.ts), c.kind === "pole" ? 4.5 : 3.5, label(w), markCls(w));
    }
  }
  node("rect", { class: "plotframe", x: ax - 4, y: top - 2, width: W - ax + 4, height: H - top - 8, fill: "none", stroke: "none" }, bg);
  function drawCursor(i) {
    cur.textContent = "";
    if (i == null) return;
    const yy = y(binTime(i) + BIN / 2);
    node("rect", { x: ax - 4, y: y(binTime(i) + BIN), width: W - ax + 4, height: binH, fill: "var(--focus)", opacity: 0.14 }, cur);
    node("line", { x1: ax - 4, x2: W, y1: yy, y2: yy, stroke: "var(--focus)", "stroke-width": 1.5 }, cur);
    node("rect", { x: 0, y: yy - 9, width: ax - 6, height: 18, rx: 2, fill: "var(--focus)" }, cur);
    text(cur, 3, yy + 4, clock(binTime(i), TZ), "t-cur");
  }
  return {
    svg, drawCursor,
    drawMoment: (i) => drawNowList(d, i),
    pick: (ev) => { const r = svg.getBoundingClientRect(); const py = ev.clientY - r.top; return py < top ? undefined : Math.min(BINS - 1, Math.max(0, BINS - 1 - Math.floor((py - top) / binH))); },
    vertical: true,
  };
}

// The "now" list above the narrow chart: the same words as the wide page's moment column.
function drawNowList(d, i) {
  const ul = $("now");
  ul.textContent = "";
  if (!d.s.lastIngest) return;
  const head = document.createElement("li");
  head.className = "when";
  head.textContent = i != null ? `${clock(binTime(i), TZ)}–${clock(binTime(i) + BIN, TZ)}` : d.lastS < NOW - 60 ? `Last word, ${clock(d.lastS * 1000, TZ)}` : "Now";
  ul.appendChild(head);
  for (const r of rowsFor()) {
    if (r.kind === "sep") continue;
    const lines = moment(d, r, i);
    const li = document.createElement("li");
    const who = document.createElement("span");
    who.className = `who${r.kind === "sub" ? " sub" : ""}`;
    who.textContent = r.id;
    const a = document.createElement("span");
    a.className = r.kind === "eng" ? "l1" : "l2";
    a.textContent = lines[0] || (r.kind === "eng" ? "" : r.kind === "pole" ? poleTally(d.s.byAgent?.Polaris) : tally(d.s.byAgent?.[r.id]));
    li.append(who, a);
    if (r.kind === "eng" || r.kind === "ci") {
      const extra = r.kind === "eng" ? (lines[1] ? `${lines[1]} · ${tally(d.s.byAgent?.[r.id])}` : tally(d.s.byAgent?.[r.id])) : [lines[1], ciSummary(d.s.counts)].filter(Boolean).join(" · ");
      const b = document.createElement("span");
      b.className = "l2";
      b.textContent = extra;
      li.appendChild(b);
    }
    ul.appendChild(li);
  }
}

// ---------------------------------------------------------------- words around the chart
function fillWords(d) {
  const s = d.s;
  const targets = Object.fromEntries(Object.entries(reviewers(s.agents, s.line, ENG)).map(([author, reviewer]) => [reviewer, author]));
  const hl = headline({ agents: s.agents, seen: s.seen, feed: s.feed, lastIngest: s.lastIngest, now: NOW_MS, timeZone: TZ, names: ENG, targets });
  document.documentElement.classList.remove("mood-live", "mood-quiet", "mood-offline", "mood-waiting");
  document.documentElement.classList.add(`mood-${hl.mood}`);
  const h1 = $("headline");
  const put = (el, parts) => { el.textContent = ""; for (const p of parts) { if (typeof p === "string") el.append(p); else { const b = document.createElement("b"); b.textContent = p.name; el.append(b); } } };
  const lh = parseFloat(getComputedStyle(h1).lineHeight);
  const maxLines = document.documentElement.classList.contains("narrow") ? 4 : 2;
  put(h1, fitHeadline(hl.forms, (f) => { put(h1, f); return h1.getBoundingClientRect().height <= lh * maxLines + 1; }));
  put($("latest"), hl.latest);
  // "about a minute behind" in place of LIVE (hq#177, question 4): events leave sk-obs01 60 s late
  const fresh = freshness(s.lastIngest, NOW_MS);
  $("fresh").textContent = hl.mood === "live" || hl.mood === "quiet" ? `About a minute behind · ${fresh}` : fresh;
  // the Halifax day (hq#177, question 5)
  $("chart-sub").textContent = `Times in ${zoneName(NOW, TZ)}. Today's counts since ${clock(d.mid, TZ)} ${zoneName(d.mid, TZ)}.`;
  document.title = `${plain(fitHeadline(hl.forms, () => true))} · setkernel live`;
}

function fillLegend(d) {
  const ul = $("legend");
  ul.textContent = "";
  const item = (svgInner, words, cls = "") => { const li = document.createElement("li"); li.innerHTML = ""; const s = document.createElementNS(SVGNS, "svg"); s.setAttribute("viewBox", "0 0 22 10"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls); svgInner(s); li.append(s, words); ul.appendChild(li); };
  const sym = (id, cls) => (s) => { s.setAttribute("viewBox", "-6 -6 12 12"); if (cls) s.setAttribute("class", cls); node("use", { href: `#m-${id}`, x: -6, y: -6, width: 12, height: 12 }, s); };
  const line = (w, c, dash) => (s) => { s.setAttribute("class", "sw"); node("line", { x1: 0, x2: 22, y1: 5, y2: 5, stroke: c, "stroke-width": w, ...(dash ? { "stroke-dasharray": dash } : {}) }, s); };
  const bars = (c) => (s) => { s.setAttribute("class", "sw"); [3, 7, 5, 9].forEach((h, i) => node("rect", { x: i * 5.5, y: 10 - h, width: 4, height: h, fill: c }, s)); };
  const sc = d.scale ?? { maxClaude: 0, maxChat: 0 };
  item(bars("var(--bar)"), `Claude requests per 10 minutes${sc.maxClaude > 1 ? ` (tallest ${sc.maxClaude})` : ""}`);
  item(bars("var(--ink-3)"), "Team chat posts");
  item(line(1, "var(--ink-3)"), STAGE_NAME.started);
  item(line(2, "var(--ink-2)"), STAGE_NAME.building);
  item(line(4, "var(--ink)"), STAGE_NAME.review);
  item(line(2, "var(--signal)", "3 2"), STAGE_NAME.fixing);
  const acts = ["picked_up", "opened_pr", "pushed", "approved", "requested_changes", "merged", "merged_by", "opened_issue", "commented", "posted_round", "decision_pr"];
  // the key lists only what this day has, so it never explains a mark that isn't there
  const seen = new Set(d.work.map((w) => w.action));
  for (const a of acts) if (seen.has(a)) item(sym(a, a === "requested_changes" ? "m-sig" : ""), ACTION_TEXT[a].replace("a teammate's ", "a "));
  if (d.ci.length) {
    const li = document.createElement("li");
    for (const [id, cls] of [["ci-pass", ""], ["ci-fail", "m-sig"]]) { const sv = document.createElementNS(SVGNS, "svg"); sym(id, cls)(sv); sv.setAttribute("aria-hidden", "true"); li.appendChild(sv); }
    li.append("CI passed, failed");
    ul.appendChild(li);
  }
}

function fillTable(d) {
  const box = $("table");
  box.textContent = "";
  const rows = [...d.work.map((w) => ({ ts: w.ts, who: w.agent, id: w.action, sig: w.action === "requested_changes", what: deed(w) })),
    ...d.ci.map((c) => ({ ts: c.ts, who: "CI", id: c.result === "pass" ? "ci-pass" : "ci-fail", sig: c.result === "fail", what: `${ciWord(c)} in ${ciWhere(c)}` }))].sort((a, b) => b.ts - a.ts);
  const t = document.createElement("table");
  const cap = document.createElement("caption");
  cap.textContent = rows.length ? `${plural(rows.length, "action", "actions")} in the last 24 hours, newest first. Claude requests and chat posts are counted per minute, not listed.` : "Nothing in the last 24 hours.";
  t.appendChild(cap);
  const head = t.createTHead().insertRow();
  for (const h of ["Time", "Who", "What"]) { const th = document.createElement("th"); th.scope = "col"; th.textContent = h; head.appendChild(th); }
  const body = t.createTBody();
  for (const r of rows) {
    const tr = body.insertRow();
    tr.insertCell().textContent = `${clock(r.ts, TZ)} ${zoneName(r.ts, TZ)}`;
    tr.insertCell().textContent = r.who;
    const td = tr.insertCell();
    const s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("viewBox", "-6 -6 12 12");
    s.setAttribute("aria-hidden", "true");
    if (r.sig) s.setAttribute("class", "m-sig");
    node("use", { href: `#m-${r.id}`, x: -6, y: -6, width: 12, height: 12 }, s);
    td.append(s, r.what);
  }
  box.appendChild(t);
}

// ---------------------------------------------------------------- scrubbing
function say(i) {
  if (i == null) { $("readout").textContent = "Back to now."; return; }
  const parts = [`${clock(binTime(i), TZ)} to ${clock(binTime(i) + BIN, TZ)}.`];
  for (const n of ENG) {
    const [what, st] = moment(D, { id: n, kind: "eng" }, i);
    if (what !== "No activity" || st) parts.push(`${n}: ${[st, what.charAt(0).toLowerCase() + what.slice(1)].filter(Boolean).join(", ")}.`);
  }
  for (const w of inBin(D.work, i).filter((w) => !ENG.includes(w.agent))) parts.push(`${sentence(w)}`);
  for (const c of inBin(D.ci, i)) parts.push(`CI ${ciWord(c)} in ${ciWhere(c)}.`);
  if (parts.length === 1) parts.push("Nothing happened.");
  $("readout").textContent = parts.join(" ");
  plotApi.svg.setAttribute("aria-valuetext", parts.join(" "));
}
function setScrub(i, speak = true) {
  scrub = i;
  plotApi.drawCursor(i);
  plotApi.drawMoment(i);
  plotApi.svg.setAttribute("aria-valuenow", i ?? BINS - 1);
  if (speak) say(i);
}
function activeBins() {
  const set = new Set();
  for (const w of D.work) set.add(Math.floor((w.ts - T0) / BIN));
  for (const c of D.ci) set.add(Math.floor((c.ts - T0) / BIN));
  return [...set].filter((i) => i >= 0 && i < BINS).sort((a, b) => a - b);
}
function wire() {
  const svg = plotApi.svg;
  svg.addEventListener("keydown", (ev) => {
    const back = plotApi.vertical ? ["ArrowDown", "ArrowLeft"] : ["ArrowLeft", "ArrowDown"];
    const fwd = plotApi.vertical ? ["ArrowUp", "ArrowRight"] : ["ArrowRight", "ArrowUp"];
    const at = scrub ?? BINS - 1;
    const step = ev.shiftKey ? 6 : 1;
    let next;
    if (back.includes(ev.key)) next = at - step;
    else if (fwd.includes(ev.key)) next = at + step;
    else if (ev.key === "PageUp") next = at - 18;
    else if (ev.key === "PageDown") next = at + 18;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = BINS - 1;
    else if (ev.key === "[") next = activeBins().filter((i) => i < at).at(-1) ?? at;
    else if (ev.key === "]") next = activeBins().find((i) => i > at) ?? at;
    else if (ev.key === "Escape") { ev.preventDefault(); return setScrub(null); }
    else return;
    ev.preventDefault();
    setScrub(Math.max(0, Math.min(BINS - 1, next)));
  });
  svg.addEventListener("pointermove", (ev) => { const i = plotApi.pick(ev); if (i !== undefined && i !== scrub) setScrub(i, false); });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) setScrub(null, false); });
  svg.addEventListener("click", (ev) => { const i = plotApi.pick(ev); if (i !== undefined) { svg.focus(); setScrub(i); } });
  svg.addEventListener("blur", () => setScrub(null, false));
}

// ---------------------------------------------------------------- the switcher and drawing
function render() {
  const root = document.documentElement;
  root.classList.toggle("shot", opts.shot);
  root.classList.toggle("wall", opts.layout === "wall");
  const narrow = opts.layout !== "wall" && innerWidth < 720;
  root.classList.toggle("narrow", narrow);
  for (const b of document.querySelectorAll(".proto button")) b.setAttribute("aria-pressed", String(opts[b.dataset.k] === b.dataset.v));
  D = prep(scenario());
  fillWords(D);
  $("now").hidden = !narrow;
  plotApi = narrow ? drawV(D) : drawH(D);
  if (narrow) drawNowList(D, null);
  fillLegend(D);
  fillTable(D);
  wire();
  if (opts.scrub != null) setScrub(+opts.scrub);
}
for (const b of document.querySelectorAll(".proto button")) b.addEventListener("click", () => {
  opts[b.dataset.k] = b.dataset.v;
  history.replaceState(null, "", `#mood=${opts.mood}&data=${opts.data}&layout=${opts.layout}`);
  render();
});
opts.scrub = new URLSearchParams(location.hash.slice(1)).get("scrub");
let lastW = innerWidth;
addEventListener("resize", () => { if (innerWidth !== lastW) { lastW = innerWidth; render(); } });
document.fonts.ready.then(render);
</script>
</body>
